# 시장 데이터 갱신: 평일 08:40~15:40(KST) 매시 40분, 그리고 수동 실행
# GitHub cron은 UTC 기준이며 실제 실행은 수 분~수십 분 늦을 수 있음
name: Refresh market data

on:
  schedule:
    - cron: '40 23 * * 0-4'   # KST 08:40 (월~금)
    - cron: '40 0-6 * * 1-5'  # KST 09:40~15:40 (월~금)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch market data
        shell: pwsh
        run: ./scripts/fetch-market-data.ps1 -OutDir ./data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update market data $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git push
          fi
